<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Laptop dashboard"><title>Laptop dashboard</title><defs><pattern id="hatch" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2.6" stroke="var(--hl-grid,#6b7c93)" stroke-width="0.9"/></pattern><style>.f-ink{fill:var(--hl-ink,#0a2540)}.s-ink{stroke:var(--hl-ink,#0a2540)}.f-graphite{fill:var(--hl-graphite,#2c3e50)}.s-graphite{stroke:var(--hl-graphite,#2c3e50)}.f-mute{fill:var(--hl-mute,#5a6a7a)}.s-mute{stroke:var(--hl-mute,#5a6a7a)}.f-grid{fill:var(--hl-grid,#6b7c93)}.s-grid{stroke:var(--hl-grid,#6b7c93)}.f-surface-3{fill:var(--hl-surface-3,#dcdce1)}.s-surface-3{stroke:var(--hl-surface-3,#dcdce1)}.f-surface-2{fill:var(--hl-surface-2,#e6e6ea)}.s-surface-2{stroke:var(--hl-surface-2,#e6e6ea)}.f-surface-1{fill:var(--hl-surface-1,#f2f2f4)}.s-surface-1{stroke:var(--hl-surface-1,#f2f2f4)}.f-surface-0{fill:var(--hl-surface-0,#ffffff)}.s-surface-0{stroke:var(--hl-surface-0,#ffffff)}.f-accent{fill:var(--hl-accent,#3b5bff)}.s-accent{stroke:var(--hl-accent,#3b5bff)}.f-accent-tint{fill:var(--hl-accent-tint,#ebefff)}.s-accent-tint{stroke:var(--hl-accent-tint,#ebefff)}@keyframes hl-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes hl-fade{from{opacity:0}to{opacity:var(--o,1)}}.hl-d{stroke-dasharray:1;stroke-dashoffset:1;animation:hl-draw .6s ease-out var(--d) both,hl-fade .3s ease-out var(--d) both}.hl-a{animation:hl-fade .33s ease-out var(--d) both}@media (prefers-reduced-motion:reduce){.hl-d,.hl-a{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}@keyframes hl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}#float{animation:hl-float 2.8s ease-in-out 1.2s infinite}@media (prefers-reduced-motion:reduce){#float{animation:none}}</style></defs><g id="illustration"><g fill="none" stroke-linejoin="round" stroke-linecap="round"><path class="s-mute hl-a" d="M636.7,435.