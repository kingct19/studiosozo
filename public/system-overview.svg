  <text x="392" y="584" fill="#737373" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Add team members freely</text>

  <rect x="580" y="532" width="188" height="76" rx="8" fill="#121212" stroke="#262626"/>
