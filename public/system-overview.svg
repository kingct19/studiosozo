  <text x="364" y="326" fill="#A3A3A3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">records, and communication</text>
  <text x="364" y="344" fill="#A3A3A3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">in one tailored interface.</text>
