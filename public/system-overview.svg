  <text x="952" y="308" fill="#A3A3A3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">Deliver clean web dashboards,</text>
  <text x="952" y="326" fill="#A3A3A3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">iOS/Android field apps, and direct</text>
  <text x="952" y="344" fill="#A3A3A3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">integrations with existing tools.</text>
  <rect x="952" y="368" width="146" height="24" rx="5" fill="#262626"/>
  <text x="964" y="384" fill="#D4D4D4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Full Code Ownership</text>

