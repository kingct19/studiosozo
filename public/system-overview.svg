  <text x="658" y="308" fill="#A3A3A3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">Automate approvals, scheduling,</text>
  <text x="658" y="326" fill="#A3A3A3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">document routing, and repetitive</text>
  <text x="658" y="344" fill="#A3A3A3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">back-office tasks automatically.</text>
